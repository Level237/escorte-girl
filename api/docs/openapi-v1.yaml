components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton Passport, n’importe quel scope.
    escort:
      type: http
      scheme: bearer
      description: Scope Passport `escort` (role_id 2).
    customer:
      type: http
      scheme: bearer
      description: Scope Passport `customer` (role_id 3).
    admin:
      type: http
      scheme: bearer
      description: Scope Passport `admin` (role_id 1).

  parameters:
    announcementId:
      name: announcement
      in: path
      required: true
      schema: { type: integer }
    townId:
      name: town
      in: path
      required: true
      schema: { type: integer }
    membershipId:
      name: membership
      in: path
      required: true
      schema: { type: integer }
    userId:
      name: user
      in: path
      required: true
      schema: { type: integer }

  responses:
    ValidationError:
      description: Champs invalides
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LookupList:
      description: Liste de référence
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Lookup'

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Meta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Token:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer }
        access_token: { type: string }
        refresh_token: { type: string }

    Tier:
      type: string
      enum: [home, free, premium, gold, vip]
      description: |
        Correspondance `subscribe_id` actuelle : free 0, premium 1, gold 2, vip 3.
        `home` agrège gold et vip.

    RegisterRequest:
      type: object
      required: [username, phone_number, password, role_id, town_id, recaptcha]
      properties:
        username: { type: string, description: Sans espace }
        phone_number: { type: string }
        password: { type: string, minLength: 6, maxLength: 30 }
        role_id: { type: integer, enum: [2, 3] }
        town_id: { type: integer }
        email: { type: string, format: email, nullable: true }
        recaptcha: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, nullable: true }
        phone_number: { type: string }
        role_id: { type: integer }
        town_id: { type: integer }
        balance: { type: integer }
        is_secure: { type: boolean }
        is_verified: { type: boolean }
        is_subscribed: { type: boolean }
        suspended_at: { type: string, format: date-time, nullable: true }

    UserEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'

    UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    SecurityQuestion:
      type: object
      properties:
        id: { type: integer }
        question: { type: string }

    Lookup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    Country:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    Town:
      type: object
      properties:
        id: { type: integer }
        town_name: { type: string }
        code: { type: string }
        country_id: { type: integer }

    TownEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Town'

    TownList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Town'

    Quarter:
      type: object
      properties:
        id: { type: integer }
        quarter_name: { type: string }
        town_id: { type: integer }

    QuarterList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Quarter'

    Faq:
      type: object
      properties:
        id: { type: integer }
        questions: { type: string }
        answer: { type: string }

    FaqWrite:
      type: object
      required: [questions, answer]
