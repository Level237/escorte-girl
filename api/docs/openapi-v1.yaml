    get:
      tags: [Admin]
      summary: Pièce jointe d’un signalement
      description: Remplace `GET /api/displayreportimage/{id}/{adsId}`.
      security: [{ admin: [] }]
      parameters:
        - name: report
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }

  /contacts:
    post:
      tags: [Messages]
      summary: Envoyer un message de contact
      requestBody:
        required: true
