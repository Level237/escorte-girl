    post:
      tags: [Messages]
      summary: Signaler une annonce
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportWrite'
      responses:
        '201':
          description: Signalement enregistré

  /payments/boosts:
    post:
      tags: [Payments]
      summary: Initier un paiement CoolPay pour booster une annonce
      description: |
        Remplace `POST /api/v1/init/cool-pay` et les variantes
        `init/payment/coolpay/{user_id}/...`. Le montant est celui du forfait.
      security: [{ escort: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [announcement_id, membership_id, transaction_ref]
              properties:
                announcement_id: { type: integer }
                membership_id: { type: integer }
                transaction_ref: { type: string }
      responses:
        '200':
          description: Lien CoolPay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'

  /payments/credits:
    post:
      tags: [Payments]
      summary: Initier un achat de crédits CoolPay
      description: Remplace `POST /api/v1/init/cool-pay/credit`. Le montant est choisi par l’utilisateur (packs existants du frontend).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, transaction_ref]
              properties:
                amount: { type: integer, description: Montant XAF }
                transaction_ref: { type: string }
      responses:
        '200':
          description: Lien CoolPay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'

  /payments/plans:
    post:
      tags: [Payments]
      summary: Initier le paiement CoolPay du forfait premium client
      description: Remplace `POST /api/v1/init/cool-pay/plan`.
      security: [{ customer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_ref]
              properties:
                transaction_ref: { type: string }
                membership_id: { type: integer, description: Défaut historique 4 si omis }
      responses:
        '200':
          description: Lien CoolPay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'

