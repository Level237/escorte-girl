openapi: 3.0.3
info:
  title: Viens Yamo API
  version: 1.0.0
  description: |
    Contrat v1. Le métier actuel est conservé (annonces, profils escort,
    crédits, forfaits, CoolPay, modération). Les routes historiques sous
    `/api` restent servies tant que le frontend n’a pas migré.

    Règles :
    - Préfixe unique `/api/v1`.
    - L’appelant authentifié est le token Passport. Jamais `user_id` dans l’URL.
    - Le prix vient de `memberships.price` côté serveur. Le client envoie `membership_id`.
    - JSON d’enveloppe unique, sauf fichiers binaires et le jeton OAuth.
    - Les callbacks CoolPay sont des webhooks, hors auth utilisateur.

servers:
  - url: http://127.0.0.1:8001/api/v1

tags:
  - name: Auth
  - name: Account
  - name: Catalog
  - name: Announcements
  - name: Escorts
  - name: Reviews
  - name: Payments
  - name: Messages
  - name: Admin
  - name: Webhooks

security: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte escort ou client
      description: Remplace `POST /api/user`. `role_id` 2 = escort, 3 = client. Le rôle admin n’est pas ouvert ici.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion par numéro de téléphone
      description: Remplace `POST /api/login`. Réponse brute Passport (pas d’enveloppe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, password]
              properties:
                phone_number: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Jeton d’accès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Compte suspendu

  /auth/logout:
    post:
      tags: [Auth]
      summary: Révoquer le jeton courant
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Déconnecté

  /auth/password/questions:
    post:
      tags: [Auth]
      summary: Questions de sécurité d’un numéro
      description: Remplace `POST /api/verify/phone`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number]
              properties:
                phone_number: { type: string }
      responses:
        '200':
          description: Questions liées au compte
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityQuestion'
        '404':
          description: Compte introuvable

  /auth/password/verify:
    post:
      tags: [Auth]
      summary: Vérifier la réponse secrète
      description: Remplace `POST /api/question/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, question_id, answer]
              properties:
                phone_number: { type: string }
                question_id: { type: integer }
                answer: { type: string }
      responses:
        '200':
          description: Réponse correcte
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reset_token: { type: string }
        '422':
          description: Réponse incorrecte

  /auth/password:
    post:
      tags: [Auth]
      summary: Nouveau mot de passe
      description: Remplace `POST /api/change/password`. Exige le `reset_token` émis par la vérification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, password, reset_token]
              properties:
                phone_number: { type: string }
                password: { type: string, minLength: 6, maxLength: 30 }
                reset_token: { type: string }
      responses:
        '200':
          description: Mot de passe mis à jour

  /me:
    get:
      tags: [Account]
      summary: Profil de l’utilisateur connecté
      description: Remplace `GET /api/v1/currentUser`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
    patch:
      tags: [Account]
      summary: Mettre à jour le profil
      description: Remplace `POST /api/v1/updateUser`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, phone_number]
              properties:
                username: { type: string }
                phone_number: { type: string }
                email: { type: string, format: email, nullable: true }
                town_id: { type: integer }
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'

  /me/security-question:
    put:
      tags: [Account]
      summary: Enregistrer la question de sécurité
      description: Remplace `POST /api/v1/choice/questions`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, answer]
              properties:
                question_id: { type: integer }
                answer: { type: string }
      responses:
        '200':
          description: Compte sécurisé

  /me/purchases:
    get:
      tags: [Account]
      summary: Achats de forfaits de l’utilisateur
      description: Remplace `GET /api/v1/purchases/user`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseList'

  /me/payments:
    get:
      tags: [Account]
      summary: Paiements de l’utilisateur
      description: Remplace `GET /api/v1/payment/user`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'

  /me/announcements:
    get:
      tags: [Announcements]
      summary: Annonces de l’escort connecté
      description: Remplace `GET /api/userAds/{id}`.
      security: [{ escort: [] }]
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementList'
    post:
      tags: [Announcements]
      summary: Créer une annonce
      description: Remplace `POST /api/v1/ads`. Vidéo optionnelle dans le même multipart.
      security: [{ escort: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementWrite'
      responses:
        '201':
          description: Annonce créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementEnvelope'

  /me/announcements/{announcement}:
    patch:
      tags: [Announcements]
      summary: Modifier une annonce de l’escort connecté
      description: Remplace `POST /api/ads/update`. L’annonce doit appartenir au token.
      security: [{ escort: [] }]
      parameters:
        - $ref: '#/components/parameters/announcementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementWrite'
      responses:
        '200':
          description: Annonce mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementEnvelope'
    delete:
      tags: [Announcements]
      summary: Supprimer une annonce de l’escort connecté
      description: Remplace `DELETE /api/ads/{id}`.
      security: [{ escort: [] }]
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '204':
          description: Supprimée

  /me/announcements/{announcement}/images:
    post:
      tags: [Announcements]
      summary: Ajouter des images
      description: Remplace `POST /api/ads/image`.
      security: [{ escort: [] }]
      parameters:
        - $ref: '#/components/parameters/announcementId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Images enregistrées

  /me/announcements/{announcement}/images/{image}:
    delete:
      tags: [Announcements]
      summary: Retirer une image
      description: Remplace `GET /api/deleteadsimage/{id}/{path}`.
      security: [{ escort: [] }]
      parameters:
        - $ref: '#/components/parameters/announcementId'
        - name: image
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Image retirée

  /me/announcements/{announcement}/subscription:
    post:
      tags: [Payments]
      summary: Activer un forfait avec le solde de crédits
      description: Remplace `POST /api/v1/subscribe/withCredit/{id}/{announcement_id}`. Le prix est débité depuis `memberships.price`.
      security: [{ escort: [] }]
      parameters:
        - $ref: '#/components/parameters/announcementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membership_id]
              properties:
                membership_id: { type: integer }
      responses:
        '200':
          description: Forfait activé
        '402':
          description: Solde insuffisant

  /me/escort:
    get:
      tags: [Escorts]
      summary: Profil escort du compte connecté
      description: Remplace `GET /api/v1/getEscort`.
      security: [{ escort: [] }]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscortEnvelope'
    put:
      tags: [Escorts]
      summary: Enregistrer ou compléter le profil
      description: Remplace `POST /api/v1/addProfile`.
      security: [{ escort: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscortWrite'
      responses:
        '200':
          description: Profil enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscortEnvelope'

  /me/escort/services:
    put:
      tags: [Escorts]
      summary: Remplacer les services proposés
      description: Remplace `POST /api/v1/attach/services`.
      security: [{ escort: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_ids]
              properties:
                service_ids:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Services attachés

  /me/escort/images:
    post:
      tags: [Escorts]
      summary: Ajouter des photos de profil
      description: Remplace `POST /api/escort/image`.
      security: [{ escort: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Photos enregistrées

  /me/subscription:
    post:
      tags: [Payments]
      summary: Passer le compte client au forfait premium avec des crédits
      description: Remplace `POST /api/v1/subscribe/member`. Réservé au scope customer. Forfait historique `memberships.id = 4`.
      security: [{ customer: [] }]
      responses:
        '200':
          description: Abonnement activé
        '402':
          description: Solde insuffisant

  /towns:
    get:
      tags: [Catalog]
      summary: Villes
      description: Remplace `GET /api/towns` et `GET /api/list/towns`.
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TownList'

  /towns/{town}:
    get:
      tags: [Catalog]
      summary: Une ville
      parameters:
        - $ref: '#/components/parameters/townId'
      responses:
        '200':
          description: Ville
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TownEnvelope'

  /towns/{town}/quarters:
    get:
      tags: [Catalog]
      summary: Quartiers d’une ville
      description: Remplace `GET /api/list/quarterByTown/{id}`.
      parameters:
        - $ref: '#/components/parameters/townId'
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarterList'

  /quarters:
    get:
      tags: [Catalog]
      summary: Tous les quartiers
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarterList'

  /countries:
    get:
      tags: [Catalog]
      summary: Pays
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Country'

  /lookups/categories:
    get:
      tags: [Catalog]
      summary: Catégories d’annonces
      description: Remplace `GET /api/list/categories`.
      responses:
        '200':
          $ref: '#/components/responses/LookupList'

  /lookups/ethnicities:
    get:
      tags: [Catalog]
      summary: Ethnies
      description: Remplace `GET /api/list/ethnics`.
      responses:
        '200':
          $ref: '#/components/responses/LookupList'

  /lookups/skin-colors:
    get:
      tags: [Catalog]
      summary: Teints
      description: Remplace `GET /api/list/skinColor`.
      responses:
        '200':
          $ref: '#/components/responses/LookupList'

  /lookups/shapes:
    get:
      tags: [Catalog]
      summary: Silhouettes
      description: Remplace `GET /api/list/shape`.
      responses:
        '200':
          $ref: '#/components/responses/LookupList'

  /lookups/heights:
    get:
      tags: [Catalog]
      summary: Tailles
      description: Remplace `GET /api/list/height`.
      responses:
        '200':
          $ref: '#/components/responses/LookupList'

  /lookups/weights:
    get:
      tags: [Catalog]
      summary: Poids
      description: Remplace `GET /api/list/weight`.
      responses:
        '200':
          $ref: '#/components/responses/LookupList'

  /lookups/services:
    get:
      tags: [Catalog]
      summary: Services proposés
      description: Remplace `GET /api/list/services`.
      responses:
        '200':
          $ref: '#/components/responses/LookupList'

  /lookups/questions:
    get:
      tags: [Catalog]
      summary: Questions de sécurité
      description: Remplace `GET /api/list/questions`.
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityQuestion'

  /faqs:
    get:
      tags: [Catalog]
      summary: FAQ publique
      description: Remplace `GET /api/faqs`. L’écriture est sous `/admin/faqs`.
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqList'

  /banners:
    get:
      tags: [Catalog]
      summary: Bannières actives
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerList'

  /memberships:
    get:
      tags: [Catalog]
      summary: Forfaits d’annonce
      description: Remplace `GET /api/memberships`. Exclut le forfait client premium (id 4).
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipList'

  /memberships/premium:
    get:
      tags: [Catalog]
      summary: Forfait premium client
      description: Remplace `GET /api/v1/get/premium`. Historiquement `memberships.id = 4`.
      responses:
        '200':
          description: Forfait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipEnvelope'

  /memberships/{membership}:
    get:
      tags: [Catalog]
      summary: Un forfait
      parameters:
        - $ref: '#/components/parameters/membershipId'
      responses:
        '200':
          description: Forfait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipEnvelope'

  /announcements:
    get:
      tags: [Announcements]
      summary: Lister les annonces publiées
      description: |
        Remplace les listes séparées (`home/annonces`, `gold/annonces`, `vip/annonces`,
        `premium/annonces`, `none/annonces`, `nonvip-ads`, `adstown`, `adsquarter`,
        `adscategory`, `populars`, `recents`, `announces`).
      parameters:
        - name: tier
          in: query
          schema:
            $ref: '#/components/schemas/Tier'
          description: |
            home = gold + vip, 9 au hasard (comportement actuel de la homepage).
            free = subscribe_id 0. premium = 1. gold = 2. vip = 3.
        - name: town_id
          in: query
          schema: { type: integer }
        - name: quarter_id
          in: query
          schema: { type: integer }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, popular, random]
            default: random
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Page d’annonces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementPage'

  /announcements/by-town:
    get:
      tags: [Announcements]
      summary: Compteurs d’annonces par ville
      description: Remplace `GET /api/announcementsTown`.
      responses:
        '200':
          description: Compteurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        town_id: { type: integer }
                        town_name: { type: string }
                        count: { type: integer }

  /announcements/{announcement}:
    get:
      tags: [Announcements]
      summary: Fiche annonce
      description: Remplace `GET /api/announce/{name}/{slug}` et `GET /api/announces/{id}`. Identifiant numérique stable.
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '200':
          description: Annonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementEnvelope'

  /announcements/{announcement}/similar:
    get:
      tags: [Announcements]
      summary: Annonces proches
      description: Remplace `GET /api/announce/similar/{name}/{slug}`.
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementList'

  /announcements/{announcement}/visits:
    post:
      tags: [Announcements]
      summary: Enregistrer une visite
      description: Remplace `GET /api/visit/{id}`. Effet de bord en POST.
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '204':
          description: Visite enregistrée

  /announcements/{announcement}/reviews:
    get:
      tags: [Reviews]
      summary: Avis d’une annonce
      description: Remplace `GET /api/list/reviews/{escortId}` (la donnée est liée à `announcement_id`).
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '200':
          description: Avis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
    post:
      tags: [Reviews]
      summary: Laisser un avis
      description: Remplace `POST /api/v1/review/new/{escortId}`. Scope customer.
      security: [{ customer: [] }]
      parameters:
        - $ref: '#/components/parameters/announcementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5, default: 3 }
                comment: { type: string }
      responses:
        '201':
          description: Avis créé

  /search:
    get:
      tags: [Announcements]
      summary: Recherche
      description: Remplace `GET /api/search/single/{term}`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementList'

  /escorts/{escort}:
    get:
      tags: [Escorts]
      summary: Profil public
      description: Remplace `GET /api/escorts/{id}`.
      parameters:
        - name: escort
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscortEnvelope'

  /escorts:
    get:
      tags: [Escorts]
      summary: Liste publique des profils
      parameters:
        - name: quarter_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Escort'

  /media/announcements/{announcement}/images/{filename}:
    get:
      tags: [Announcements]
      summary: Fichier image d’annonce
      description: Remplace `GET /api/displayadsimage/{id}/{path}`. Réponse binaire.
      parameters:
        - $ref: '#/components/parameters/announcementId'
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }

  /media/announcements/{announcement}/video:
    get:
      tags: [Announcements]
      summary: Vidéo d’annonce
      description: Remplace `GET /api/displayVideo/{id}/{path}`.
      parameters:
        - $ref: '#/components/parameters/announcementId'
      responses:
        '200':
          description: Vidéo
          content:
            video/*:
              schema: { type: string, format: binary }

  /media/banners/{banner}:
    get:
      tags: [Catalog]
      summary: Image de bannière
      description: Remplace `GET /api/displaybanner/{id}`.
      parameters:
        - name: banner
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }

  /media/escorts/{escort}/images/{filename}:
    get:
      tags: [Escorts]
      summary: Photo de profil
      description: Remplace `GET /api/displayprofil/{id}/{path}`.
      parameters:
        - name: escort
          in: path
          required: true
          schema: { type: integer }
        - name: filename
          in: path
          required: true
          schema: { type: string }
